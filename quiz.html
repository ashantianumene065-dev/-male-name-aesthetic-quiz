<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Find Your Name</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3eee7;
      color: #171717;
      font-family: Georgia, "Times New Roman", serif;
    }

    .quiz {
      width: 92%;
      max-width: 800px;
      margin: 35px auto;
      background: #fffdf9;
      border: 1px solid #bdb6ae;
      min-height: 600px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid #171717;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .content {
      padding: 70px 40px;
      text-align: center;
    }

    .number {
      color: #9d1d3d;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      max-width: 650px;
      margin: 18px auto 35px;
      font-size: clamp(32px, 6vw, 55px);
      font-weight: normal;
      line-height: 1.05;
    }

    .answers {
      max-width: 560px;
      margin: auto;
      display: grid;
      gap: 12px;
    }

    .answer {
      width: 100%;
      padding: 17px 20px;
      background: transparent;
      border: 1px solid #171717;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      cursor: pointer;
    }

    .answer:hover {
      background: #9d1d3d;
      color: white;
    }

    .footer {
      padding: 12px 18px;
      border-top: 1px solid #171717;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #77716b;
    }

    @media (max-width: 600px) {
      .content {
        padding: 55px 22px;
      }
    }
  </style>

</head>

<body>

  <main class="quiz">

    <div class="topbar">
      <span>The Name Index</span>
      <span>40 Possible Names</span>
    </div>

    <section class="content">

     <div class="number" id="question-number">
        Question 01
      </div>

   <h1 id="question-text">
        Your Friday night has absolutely no plans.
        Where do you end up?
      </h1>

    <div class="answers" id="answers">

        <button class="answer">
          At home, surrounded by my things.
        </button>

        <button class="answer">
          Somewhere dimly lit with a drink.
        </button>

        <button class="answer">
          In somebody's car. Don't ask whose.
        </button>

        <button class="answer">
          Wherever everyone else ended up.
        </button>

      </div>

    </section>

    <div class="footer">
      An evolving index of femininity, classified under the names of men.
    </div>

  </main>

  <script>
  const questions = [
    {
      question: "Your Friday night has absolutely no plans. Where do you end up?",
      answers: [
        "At home, surrounded by my things.",
        "Somewhere dimly lit with a drink.",
        "In somebody's car. Don't ask whose.",
        "Wherever everyone else ended up."
      ]
    },

    {
      question: "You have $80 you absolutely do not need to spend. What happens to it?",
      answers: [
        "I buy something for my room.",
        "Clothes. Immediately.",
        "Food, drinks, and whatever happens afterward.",
        "I somehow spend it on six completely unrelated things."
      ]
    }
  ];

    let currentQuestion = 0;

const answerButtons = document.querySelectorAll(".answer");

function showQuestion() {
  const question = questions[currentQuestion];

  document.getElementById("question-number").textContent =
    "Question " + String(currentQuestion + 1).padStart(2, "0");

  document.getElementById("question-text").textContent =
    question.question;

  answerButtons.forEach((button, index) => {
    button.textContent = question.answers[index];
  });
}

answerButtons.forEach((button) => {
  button.addEventListener("click", () => {
    currentQuestion++;

    if (currentQuestion < questions.length) {
      showQuestion();
    }
  });
});

showQuestion();
</script>
</body>

</html>
